services:
  bookshop:
    build:
      context: .
    container_name: bookshop-vwa
    hostname: bookshop
    environment:
      BOOKSHOP_SEED: "${BOOKSHOP_SEED:-}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-18080}:8080"
      - "${BIND_ADDRESS:-127.0.0.1}:${SSH_PORT:-12222}:22"
    networks:
      - lab
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s

networks:
  lab:
    driver: bridge
